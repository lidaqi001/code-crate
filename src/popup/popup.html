<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>码匣 CodeCrate</title>
    <script src="../core/theme-init.js"></script>
    <link rel="stylesheet" href="../core/tokens.css" />
    <link rel="stylesheet" href="../core/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <header class="popup-head">
      <span class="logo" id="brand-logo" aria-hidden="true"></span>
      <strong class="popup-title">码匣</strong>
      <span class="hint" id="count"></span>
      <span class="spacer"></span>
      <button class="btn btn-icon" id="home-btn" type="button" title="全部工具" aria-label="打开全部工具"></button>
      <button class="btn btn-icon" id="palette-btn" type="button" title="命令面板" aria-label="打开命令面板"></button>
      <span id="theme-slot"></span>
    </header>

    <div class="popup-search">
      <span class="search-icon" id="search-icon" aria-hidden="true"></span>
      <input
        id="search"
        type="search"
        placeholder="搜索工具、功能或关键词…"
        autocomplete="off"
        spellcheck="false"
        aria-label="搜索工具"
      />
    </div>

    <nav class="chips" id="cats" aria-label="按分类筛选"></nav>

    <main class="tool-list" id="list" role="listbox" aria-label="工具列表"></main>

    <footer class="popup-foot">
      <span><span class="kbd">↑</span><span class="kbd">↓</span> 选择</span>
      <span><span class="kbd">Enter</span> 打开</span>
      <span><span class="kbd">Ctrl K</span> 命令面板</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
