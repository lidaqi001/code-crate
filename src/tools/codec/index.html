<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>编解码 / 哈希 · 码匣</title>
    <script src="../../core/theme-init.js"></script>
    <link rel="stylesheet" href="../../core/tokens.css" />
    <link rel="stylesheet" href="../../core/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-tool="codec">
    <header class="app-header" id="app-header"></header>

    <main class="tool-main codec-main">
      <div class="panel">
        <div class="panel-head">
          <div class="segmented" id="modes" role="tablist" aria-label="功能切换">
            <button type="button" role="tab" data-mode="transform" aria-selected="true">编码转换</button>
            <button type="button" role="tab" data-mode="hash" aria-selected="false">哈希校验</button>
            <button type="button" role="tab" data-mode="jwt" aria-selected="false">JWT 解析</button>
            <button type="button" role="tab" data-mode="naming" aria-selected="false">命名风格</button>
            <button type="button" role="tab" data-mode="query" aria-selected="false">查询串</button>
          </div>
          <span class="spacer"></span>
          <button class="btn btn-sm btn-danger" type="button" id="btn-clear">清空</button>
        </div>
        <div class="panel-body" id="stage"></div>
        <div class="panel-foot" id="status"></div>
      </div>
    </main>

    <script type="module" src="ui.js"></script>
  </body>
</html>
