<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>动态口令 · 码匣</title>
    <script src="../../core/theme-init.js"></script>
    <link rel="stylesheet" href="../../core/tokens.css" />
    <link rel="stylesheet" href="../../core/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-tool="otp">
    <header class="app-header" id="app-header"></header>

    <main class="tool-main otp-layout">
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">密钥与参数</span>
          <span class="spacer"></span>
          <button class="btn btn-sm btn-danger" type="button" id="btn-clear">清空</button>
        </div>

        <div class="panel-body">
          <div class="field">
            <label for="secret">密钥</label>
            <textarea id="secret" class="mono" spellcheck="false" autocomplete="off" aria-label="密钥" placeholder="Base32 密钥，或直接粘贴 otpauth:// 链接"></textarea>
          </div>

          <label class="privacy-toggle" for="remember-secret">
            <input type="checkbox" id="remember-secret" />
            <span>在本机记住密钥（关闭后刷新即清空，任何内容都不会上传）</span>
          </label>

          <div class="work-row">
            <div class="field">
              <label for="secret-format">密钥格式</label>
              <select id="secret-format" aria-label="密钥格式"></select>
            </div>
            <button class="btn btn-sm" type="button" id="btn-parse">解析 otpauth 链接</button>
          </div>

          <div class="work-row">
            <div class="field">
              <label for="type">类型</label>
              <select id="type" aria-label="类型">
                <option value="totp">TOTP（基于时间）</option>
                <option value="hotp">HOTP（基于计数）</option>
              </select>
            </div>
            <div class="field">
              <label for="algorithm">算法</label>
              <select id="algorithm" aria-label="算法"></select>
            </div>
            <div class="field">
              <label for="digits">位数</label>
              <select id="digits" aria-label="位数"></select>
            </div>
            <div class="field" id="period-field">
              <label for="period">周期（秒）</label>
              <select id="period" aria-label="周期"></select>
            </div>
            <div class="field" id="counter-field">
              <label for="counter">计数器</label>
              <input type="number" id="counter" min="0" value="0" aria-label="计数器" />
            </div>
          </div>

          <div class="work-row">
            <div class="field wide">
              <label for="account">账户名（用于生成链接）</label>
              <input type="text" id="account" placeholder="ada@example.com" aria-label="账户名" />
            </div>
            <div class="field wide">
              <label for="issuer">发行方</label>
              <input type="text" id="issuer" placeholder="GitHub" aria-label="发行方" />
            </div>
          </div>

          <div class="section-label">密钥信息</div>
          <div id="secret-info"></div>
        </div>

        <div class="panel-foot" id="status"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">口令</span>
          <span class="spacer"></span>
          <span class="row" id="actions"></span>
        </div>

        <div class="panel-body" id="output"></div>

        <div class="panel-foot" id="foot"></div>
      </section>
    </main>

    <script type="module" src="ui.js"></script>
  </body>
</html>
