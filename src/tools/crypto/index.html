<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>加密与摘要 · 码匣</title>
    <script src="../../core/theme-init.js"></script>
    <link rel="stylesheet" href="../../core/tokens.css" />
    <link rel="stylesheet" href="../../core/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-tool="crypto">
    <header class="app-header" id="app-header"></header>

    <main class="tool-main crypto-layout">
      <div class="panel">
        <div class="panel-head">
          <div class="segmented" id="modes" role="tablist" aria-label="功能切换">
            <button type="button" role="tab" data-mode="hmac" aria-selected="true">HMAC 签名</button>
            <button type="button" role="tab" data-mode="aes" aria-selected="false">AES-GCM</button>
            <button type="button" role="tab" data-mode="kdf" aria-selected="false">PBKDF2 与随机</button>
          </div>
          <span class="spacer"></span>
          <span class="hint" id="hint"></span>
        </div>
        <div class="panel-body" id="stage"></div>
        <div class="panel-foot" id="status"></div>
      </div>
    </main>

    <script type="module" src="ui.js"></script>
  </body>
</html>
