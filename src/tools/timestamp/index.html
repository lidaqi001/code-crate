<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>时间戳转换 · 码匣</title>
    <script src="../../core/theme-init.js"></script>
    <link rel="stylesheet" href="../../core/tokens.css" />
    <link rel="stylesheet" href="../../core/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-tool="timestamp">
    <header class="app-header" id="app-header"></header>

    <main class="tool-main ts-main">
      <div class="panel">
        <div class="panel-head">
          <div class="segmented" id="modes" role="tablist" aria-label="功能切换">
            <button type="button" role="tab" data-mode="now" aria-selected="true">当前时间</button>
            <button type="button" role="tab" data-mode="fromTs" aria-selected="false">时间戳 → 时间</button>
            <button type="button" role="tab" data-mode="toTs" aria-selected="false">时间 → 时间戳</button>
            <button type="button" role="tab" data-mode="diff" aria-selected="false">日期差</button>
          </div>
          <span class="spacer"></span>
          <span class="row" id="tz-slot"></span>
        </div>
        <div class="panel-body" id="stage"></div>
        <div class="panel-foot" id="status"></div>
      </div>
    </main>

    <script type="module" src="ui.js"></script>
  </body>
</html>
