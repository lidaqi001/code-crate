<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Code 128 条码 · 码匣</title>
    <script src="../../core/theme-init.js"></script>
    <link rel="stylesheet" href="../../core/tokens.css" />
    <link rel="stylesheet" href="../../core/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-tool="barcode">
    <header class="app-header" id="app-header"></header>

    <main class="tool-main barcode-layout">
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">内容与尺寸</span>
          <span class="spacer"></span>
          <button class="btn btn-sm" type="button" id="btn-sample">示例</button>
        </div>
        <div class="panel-body" id="form"></div>
        <div class="panel-foot" id="status"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">预览</span>
          <span class="spacer"></span>
          <span class="row" id="actions"></span>
        </div>
        <div class="panel-body" id="preview"></div>
        <div class="panel-foot" id="foot"></div>
      </section>
    </main>

    <script type="module" src="ui.js"></script>
  </body>
</html>
