<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>UUID / 随机 · 码匣</title>
    <script src="../../core/theme-init.js"></script>
    <link rel="stylesheet" href="../../core/tokens.css" />
    <link rel="stylesheet" href="../../core/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-tool="uuid">
    <header class="app-header" id="app-header"></header>

    <main class="tool-main uuid-main">
      <div class="panel">
        <div class="panel-head">
          <div class="segmented" id="modes" role="tablist" aria-label="功能切换">
            <button type="button" role="tab" data-mode="identifier" aria-selected="true">标识符</button>
            <button type="button" role="tab" data-mode="password" aria-selected="false">强密码</button>
            <button type="button" role="tab" data-mode="string" aria-selected="false">随机字符串</button>
            <button type="button" role="tab" data-mode="number" aria-selected="false">随机整数</button>
            <button type="button" role="tab" data-mode="validate" aria-selected="false">UUID 校验</button>
          </div>
          <span class="spacer"></span>
          <button class="btn btn-sm btn-primary" type="button" id="btn-generate">生成</button>
        </div>
        <div class="panel-body" id="stage"></div>
        <div class="panel-foot" id="status"></div>
      </div>
    </main>

    <script type="module" src="ui.js"></script>
  </body>
</html>
